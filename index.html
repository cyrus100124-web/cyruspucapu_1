<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#11131f">
  <title>英雄大轉盤</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #11131f;
      --panel: rgba(26, 29, 45, .88);
      --line: rgba(255,255,255,.1);
      --muted: #a5a8bb;
      --text: #f5f5fb;
      --pink: #ff5fa2;
      --orange: #ffb65c;
      --cyan: #7ae5e7;
    }
    * { box-sizing: border-box; }
    html { -webkit-text-size-adjust: 100%; text-size-adjust: 100%; }
    button, input { touch-action: manipulation; }
    body {
      margin: 0;
      min-height: 100vh;
      color: var(--text);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, "Segoe UI", "Microsoft JhengHei", sans-serif;
      background:
        radial-gradient(ellipse at 17% 11%, rgba(122,229,231,.12), transparent 31rem),
        radial-gradient(ellipse at 85% 25%, rgba(255,95,162,.12), transparent 29rem),
        var(--bg);
    }
    .page { width: min(1240px, calc(100% - 40px)); margin: 0 auto; padding: 36px 0 48px; }
    header { display: flex; align-items: center; justify-content: space-between; gap: 20px; margin-bottom: 26px; }
    .brand { display: flex; align-items: center; gap: 14px; }
    .brand-mark { display: grid; place-items: center; width: 46px; height: 46px; border-radius: 15px; color: #141522; font-size: 24px; background: linear-gradient(135deg, var(--cyan), #b7ffcf); box-shadow: 0 8px 30px rgba(122,229,231,.2); }
    h1 { margin: 0; font-size: clamp(25px, 4vw, 34px); letter-spacing: .04em; }
    .eyebrow { margin: 0 0 5px; color: var(--cyan); font-size: 11px; font-weight: 800; letter-spacing: .22em; text-transform: uppercase; }
    .header-note { color: var(--muted); font-size: 13px; text-align: right; }
    .layout { display: grid; grid-template-columns: minmax(0, 1.35fr) minmax(320px, .75fr); gap: 22px; align-items: stretch; }
    .panel { border: 1px solid var(--line); border-radius: 24px; background: var(--panel); box-shadow: 0 22px 70px rgba(0,0,0,.23); backdrop-filter: blur(18px); }
    .wheel-panel { min-height: 680px; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 30px 34px; overflow: hidden; }
    .wheel-heading { align-self: stretch; display: flex; align-items: center; justify-content: space-between; gap: 14px; margin: 0 0 16px; }
    .wheel-heading h2, .side-heading h2 { margin: 0; font-size: 17px; }
    .count-pill { border: 1px solid rgba(122,229,231,.24); padding: 7px 11px; border-radius: 99px; color: var(--cyan); background: rgba(122,229,231,.08); font-size: 12px; white-space: nowrap; }
    .wheel-wrap { position: relative; width: min(100%, 590px); aspect-ratio: 1; display: grid; place-items: center; }
    canvas { display: block; width: 100%; height: 100%; filter: drop-shadow(0 18px 30px rgba(0,0,0,.38)); }
    .pointer { position: absolute; z-index: 2; top: -2px; left: 50%; width: 0; height: 0; transform: translateX(-50%); border-left: 16px solid transparent; border-right: 16px solid transparent; border-top: 35px solid #fff2b0; filter: drop-shadow(0 3px 7px rgba(0,0,0,.55)); }
    .spin-button { position: absolute; z-index: 3; width: 26%; min-width: 112px; aspect-ratio: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; border: 7px solid rgba(255,255,255,.16); border-radius: 50%; color: #191522; cursor: pointer; background: linear-gradient(145deg, #ffe19b, var(--orange) 55%, #ff8c73); box-shadow: 0 8px 32px rgba(255,155,100,.35), inset 0 2px 3px rgba(255,255,255,.6); transition: transform .15s ease, filter .15s ease; }
    .spin-button:hover { transform: scale(1.045); filter: brightness(1.06); }
    .spin-button:active { transform: scale(.98); }
    .spin-button:disabled { cursor: wait; filter: saturate(.7); }
    .spin-button strong { font-size: clamp(17px, 2vw, 22px); letter-spacing: .08em; }
    .spin-button span { margin-top: 3px; font-size: 10px; font-weight: 800; letter-spacing: .14em; opacity: .72; }
    .wheel-caption { margin: 15px 0 0; color: var(--muted); font-size: 12px; text-align: center; }
    .side { display: flex; flex-direction: column; gap: 18px; }
    .result-card { position: relative; padding: 23px 24px 21px; overflow: hidden; }
    .result-card::after { content: ""; position: absolute; width: 170px; height: 170px; right: -62px; top: -82px; border-radius: 50%; background: rgba(255,95,162,.13); filter: blur(4px); pointer-events: none; }
    .side-heading { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
    .tag { color: var(--pink); font-size: 10px; font-weight: 900; letter-spacing: .17em; }
    .result-name { min-height: 70px; display: flex; align-items: center; margin: 10px 0 5px; font-size: clamp(27px, 4vw, 39px); font-weight: 850; letter-spacing: .03em; overflow-wrap: anywhere; }
    .result-hint { margin: 0; color: var(--muted); font-size: 12px; }
    .history { display: flex; flex-wrap: wrap; gap: 7px; margin-top: 16px; min-height: 29px; }
    .history-item { border: 1px solid rgba(255,255,255,.12); padding: 6px 9px; border-radius: 99px; color: #d9d8e5; background: rgba(255,255,255,.045); font-size: 11px; }
    .list-card { padding: 21px 22px 18px; min-height: 0; display: flex; flex-direction: column; flex: 1; }
    .list-subtitle { margin: 6px 0 14px; color: var(--muted); font-size: 12px; }
    .search { width: 100%; min-height: 44px; border: 1px solid var(--line); border-radius: 12px; padding: 11px 13px; outline: none; color: var(--text); background: rgba(9,11,20,.48); font: inherit; font-size: 13px; }
    .search:focus { border-color: rgba(122,229,231,.65); box-shadow: 0 0 0 3px rgba(122,229,231,.1); }
    .hero-list { display: grid; grid-template-columns: repeat(2, minmax(0,1fr)); align-content: start; gap: 5px 8px; margin-top: 12px; padding-right: 4px; overflow: auto; max-height: 360px; scrollbar-color: rgba(255,255,255,.2) transparent; scrollbar-width: thin; }
    .hero-item { min-width: 0; padding: 7px 8px; border-radius: 8px; color: #d5d6e2; background: rgba(255,255,255,.035); font-size: 11px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .hero-item:nth-child(4n+1), .hero-item:nth-child(4n+2) { background: rgba(255,255,255,.065); }
    .empty { grid-column: 1 / -1; padding: 16px 8px; color: var(--muted); font-size: 12px; text-align: center; }
    .list-footer { display: flex; justify-content: space-between; gap: 10px; margin-top: 12px; color: var(--muted); font-size: 11px; }
    .reset { border: 0; padding: 0; color: var(--cyan); cursor: pointer; background: transparent; font: inherit; font-size: 11px; }
    .reset:hover { color: #c8ffff; }
    button:focus-visible { outline: 3px solid var(--cyan); outline-offset: 3px; }
    @media (max-width: 900px) { .layout { grid-template-columns: 1fr; } .wheel-panel { min-height: auto; } .wheel-wrap { width: min(100%, 600px); } .side { display: grid; grid-template-columns: 1fr 1fr; align-items: stretch; } .result-card { min-height: 230px; } .list-card { min-height: 420px; } }
    @media (max-width: 620px) { .page { width: min(100% - 24px, 520px); padding-top: max(22px, env(safe-area-inset-top)); padding-bottom: calc(28px + env(safe-area-inset-bottom)); } header { align-items: flex-start; } .header-note { max-width: 110px; font-size: 11px; } .wheel-panel { padding: 20px 13px 24px; border-radius: 19px; } .wheel-heading { padding: 0 5px; } .side { display: flex; } .result-card, .list-card { padding: 19px; } .search { font-size: 16px; } .hero-list { max-height: none; overflow: visible; } .result-card { min-height: 0; } }
    @media (prefers-reduced-motion: reduce) { *, *::before, *::after { scroll-behavior: auto !important; transition-duration: .01ms !important; } }
  </style>
</head>
<body>
  <main class="page">
    <header>
      <div class="brand">
        <div class="brand-mark" aria-hidden="true">✦</div>
        <div><p class="eyebrow">HERO ROULETTE</p><h1>英雄大轉盤</h1></div>
      </div>
      <div class="header-note">選擇困難？<br>讓命運幫你決定。</div>
    </header>

    <div class="layout">
      <section class="panel wheel-panel" aria-label="英雄抽選轉盤">
        <div class="wheel-heading">
          <h2>準備好抽出你的英雄了嗎？</h2>
          <span class="count-pill" id="wheelCount">載入中</span>
        </div>
        <div class="wheel-wrap">
          <canvas id="wheel" aria-label="由全部英雄組成的彩色轉盤"></canvas>
          <div class="pointer" aria-hidden="true"></div>
          <button class="spin-button" id="spinButton" type="button" aria-label="開始轉動轉盤">
            <strong>開始</strong><span>SPIN</span>
          </button>
        </div>
        <p class="wheel-caption">點擊中央按鈕開始轉動 · 每位英雄都有相同機率</p>
      </section>

      <aside class="side">
        <section class="panel result-card" aria-live="polite">
          <div class="side-heading"><h2>命運揭曉</h2><span class="tag">YOUR PICK</span></div>
          <div class="result-name" id="resultName">等你來轉</div>
          <p class="result-hint" id="resultHint">轉盤停下後，抽選結果會顯示在這裡。</p>
          <div class="history" id="history" aria-label="最近抽選結果"></div>
        </section>

        <section class="panel list-card">
          <div class="side-heading"><h2>英雄名單</h2><button class="reset" id="resetButton" type="button">清除紀錄</button></div>
          <p class="list-subtitle">所有選項都在轉盤中 · 搜尋來確認名單</p>
          <input class="search" id="search" type="search" placeholder="搜尋英雄名稱…" autocomplete="off" aria-label="搜尋英雄名稱">
          <div class="hero-list" id="heroList" aria-live="polite"></div>
          <div class="list-footer"><span id="visibleCount"></span><span>名單依照提供順序</span></div>
        </section>
      </aside>
    </div>
  </main>
  <script>
    const heroes = [
      "刀锋宝贝", "王维", "卢雅那", "孙悟空", "心魔六耳", "元流之子(刺客)", "大禹", "元流之子(辅助)", "蚩奼", "孙权",
      "元流之子(射手)", "空空儿", "苍", "影", "少司缘", "元流之子(坦克)", "元流之子(法师)", "敖隐", "大司命", "云中君",
      "海诺", "朵莉亚", "亚连", "姬小满", "狂铁", "莱西奥", "赵怀真", "海月", "戈娅", "宫本武藏",
      "桑启", "暃", "金蝉", "姜子牙", "弈星", "梦奇", "艾琳", "云缨", "司空震", "澜",
      "夏洛特", "阿古朵", "蒙恬", "廉颇", "镜", "白起", "蒙犽", "鲁班大师", "西施", "马超",
      "曜", "瑶", "盘古", "猪八戒", "嫦娥", "鬼谷子", "李信", "上官婉儿", "元歌", "米莱狄",
      "马可波罗", "张良", "裴擒虎", "杨玉环", "公孙离", "明世隐", "后羿", "女娲", "苏烈", "周瑜",
      "百里玄策", "百里守约", "铠", "芈月", "亚瑟", "盾山", "沈梦溪", "伽罗", "司马懿", "孙策",
      "干将莫邪", "狄仁杰", "刘备", "阿轲", "刘邦", "东皇太一", "大乔", "黄忠", "诸葛亮", "哪吒",
      "太乙真人", "蔡文姬", "雅典娜", "杨戬", "钟馗", "虞姬", "李元芳", "张飞", "牛魔", "橘右京",
      "娜可露露", "不知火舞", "花木兰", "兰陵王", "王昭君", "韩信", "露娜", "程咬金", "安琪拉", "貂蝉",
      "关羽", "老夫子", "武则天", "项羽", "达摩", "李白", "典韦", "曹操", "甄姬", "夏侯惇",
      "吕布", "扁鹊", "孙膑", "钟无艳", "高渐离", "刘禅", "庄周", "鲁班七号", "孙尚香", "嬴政",
      "妲己", "墨子", "赵云", "小乔"
    ];

    const canvas = document.getElementById("wheel");
    const ctx = canvas.getContext("2d");
    const spinButton = document.getElementById("spinButton");
    const resultName = document.getElementById("resultName");
    const resultHint = document.getElementById("resultHint");
    const heroList = document.getElementById("heroList");
    const search = document.getElementById("search");
    const historyEl = document.getElementById("history");
    const palette = ["#ff6f91", "#ff9f68", "#ffd166", "#8ed081", "#4ecdc4", "#66a6e8", "#8c83e6", "#c879d7"];
    const TAU = Math.PI * 2;
    let rotation = 0;
    let spinning = false;
    let history = [];
    let animationFrame;

    function drawWheel() {
      const size = canvas.clientWidth;
      if (!size) return;
      const dpr = window.devicePixelRatio || 1;
      const pixelSize = Math.round(size * dpr);
      if (canvas.width !== pixelSize || canvas.height !== pixelSize) {
        canvas.width = pixelSize;
        canvas.height = pixelSize;
      }
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      ctx.clearRect(0, 0, size, size);
      const center = size / 2;
      const radius = size * .465;
      const step = TAU / heroes.length;
      ctx.save();
      ctx.translate(center, center);
      ctx.rotate(rotation);
      for (let i = 0; i < heroes.length; i++) {
        const start = i * step;
        ctx.beginPath();
        ctx.moveTo(0, 0);
        ctx.arc(0, 0, radius, start, start + step);
        ctx.closePath();
        ctx.fillStyle = palette[i % palette.length];
        ctx.fill();
        ctx.strokeStyle = "rgba(20, 20, 34, .42)";
        ctx.lineWidth = Math.max(1, size * .0022);
        ctx.stroke();
      }
      ctx.restore();
      ctx.beginPath();
      ctx.arc(center, center, radius + size * .012, 0, TAU);
      ctx.strokeStyle = "rgba(255,255,255,.78)";
      ctx.lineWidth = size * .014;
      ctx.stroke();
      ctx.beginPath();
      ctx.arc(center, center, radius + size * .026, 0, TAU);
      ctx.strokeStyle = "rgba(255,255,255,.14)";
      ctx.lineWidth = size * .006;
      ctx.stroke();
      const dotRadius = size * .008;
      for (let i = 0; i < 36; i++) {
        const a = i * TAU / 36 - Math.PI / 2;
        const r = radius + size * .026;
        ctx.beginPath();
        ctx.arc(center + Math.cos(a) * r, center + Math.sin(a) * r, dotRadius, 0, TAU);
        ctx.fillStyle = i % 3 === 0 ? "#fff0aa" : "rgba(255,255,255,.55)";
        ctx.fill();
      }
    }

    function renderList() {
      const query = search.value.trim().toLocaleLowerCase();
      const matches = heroes.filter(name => name.toLocaleLowerCase().includes(query));
      heroList.replaceChildren();
      if (!matches.length) {
        const empty = document.createElement("div");
        empty.className = "empty";
        empty.textContent = "找不到符合的英雄";
        heroList.append(empty);
      } else {
        const fragment = document.createDocumentFragment();
        for (const name of matches) {
          const item = document.createElement("div");
          item.className = "hero-item";
          item.textContent = name;
          item.title = name;
          fragment.append(item);
        }
        heroList.append(fragment);
      }
      document.getElementById("visibleCount").textContent = query ? `顯示 ${matches.length} / ${heroes.length} 位` : `共 ${heroes.length} 位英雄`;
    }

    function renderHistory() {
      historyEl.replaceChildren();
      for (const name of history) {
        const chip = document.createElement("span");
        chip.className = "history-item";
        chip.textContent = name;
        historyEl.append(chip);
      }
    }

    function normalize(angle) { return ((angle % TAU) + TAU) % TAU; }

    function spin() {
      if (spinning) return;
      spinning = true;
      spinButton.disabled = true;
      resultHint.textContent = "轉盤正在選擇你的英雄…";
      const step = TAU / heroes.length;
      const targetIndex = Math.floor(Math.random() * heroes.length);
      const alignedRotation = -Math.PI / 2 - (targetIndex + .5) * step;
      const delta = 8 * TAU + normalize(alignedRotation - rotation);
      const startRotation = rotation;
      const endRotation = rotation + delta;
      const duration = window.matchMedia("(prefers-reduced-motion: reduce)").matches ? 250 : 5200;
      const startTime = performance.now();

      function frame(now) {
        const t = Math.min(1, (now - startTime) / duration);
        const eased = 1 - Math.pow(1 - t, 4);
        rotation = startRotation + delta * eased;
        drawWheel();
        if (t < 1) {
          animationFrame = requestAnimationFrame(frame);
        } else {
          rotation = endRotation;
          drawWheel();
          showResult(heroes[targetIndex]);
          spinning = false;
          spinButton.disabled = false;
        }
      }
      animationFrame = requestAnimationFrame(frame);
    }

    function showResult(name) {
      resultName.textContent = name;
      resultHint.textContent = "這次就選它吧！再轉一次，看看下一位是誰。";
      history.unshift(name);
      history = history.slice(0, 5);
      renderHistory();
    }

    document.getElementById("wheelCount").textContent = `${heroes.length} 位英雄`;
    search.addEventListener("input", renderList);
    spinButton.addEventListener("click", spin);
    document.getElementById("resetButton").addEventListener("click", () => {
      history = [];
      renderHistory();
      resultName.textContent = "等你來轉";
      resultHint.textContent = "轉盤停下後，抽選結果會顯示在這裡。";
    });
    window.addEventListener("resize", drawWheel);
    renderList();
    drawWheel();
  </script>
</body>
</html>
