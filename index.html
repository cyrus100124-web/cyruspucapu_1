<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#09111b">
  <title>英雄大轉盤</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800&family=Manrope:wght@400;500;600;700;800&display=swap');
    :root {
      color-scheme: dark;
      --ink: #f0f5f4; --muted: #b5c4c7; --dim: #8da1a8;
      --bg: #09111b; --panel: #111d2b; --panel-raised: #182739;
      --line: #314455; --line-soft: rgba(175, 204, 207, .14);
      --lime: #d1fa67; --lime-deep: #a8d849; --ember: #ff9a67;
      --shadow: 0 24px 64px rgba(0, 0, 0, .34);
    }
    * { box-sizing: border-box; }
    html { -webkit-text-size-adjust: 100%; text-size-adjust: 100%; scroll-behavior: smooth; }
    body {
      margin: 0; min-height: 100vh; color: var(--ink);
      font-family: Manrope, "Microsoft JhengHei", sans-serif;
      background: radial-gradient(ellipse at 52% -20%, #1c3240 0, transparent 52rem), var(--bg);
      -webkit-font-smoothing: antialiased;
    }
    button, input { font: inherit; }
    button { touch-action: manipulation; }
    ::selection { color: #101817; background: var(--lime); }
    :focus-visible { outline: 3px solid var(--lime); outline-offset: 4px; }
    .page { width: min(1320px, calc(100% - 48px)); margin: 0 auto; padding: 28px 0 54px; }
    header { display: flex; align-items: center; justify-content: space-between; gap: 24px; margin-bottom: 22px; }
    .brand { display: flex; align-items: center; gap: 15px; min-width: 0; }
    .brand-mark {
      width: 48px; height: 48px; flex: 0 0 48px; display: grid; place-items: center;
      border: 1px solid rgba(209, 250, 103, .55); border-radius: 14px;
      color: #111b17; background: var(--lime); box-shadow: 0 7px 22px rgba(0, 0, 0, .24);
    }
    .brand-mark svg { width: 25px; height: 25px; }
    h1 { margin: 0; font-family: "Barlow Condensed", "Arial Narrow", sans-serif; font-size: clamp(31px, 4vw, 48px); line-height: 1.02; font-weight: 800; letter-spacing: -.025em; }
    .header-note { color: var(--muted); font-size: 13px; font-weight: 600; text-align: right; line-height: 1.65; }
    .layout { display: grid; grid-template-columns: minmax(0, 1.35fr) minmax(330px, .72fr); gap: 18px; align-items: stretch; }
    .panel {
      border: 1px solid var(--line); border-radius: 18px; background: var(--panel);
      box-shadow: var(--shadow);
    }
    .wheel-panel { min-width: 0; min-height: 680px; padding: 21px clamp(18px, 3vw, 34px) 20px; display: flex; flex-direction: column; align-items: center; justify-content: center; overflow: hidden; }
    .wheel-heading { width: 100%; display: flex; align-items: center; justify-content: space-between; gap: 12px; margin: 0 0 5px; }
    .wheel-heading h2, .side-heading h2 { margin: 0; font-size: 16px; line-height: 1.35; font-weight: 800; }
    .wheel-controls { display: flex; align-items: center; gap: 9px; flex: 0 0 auto; }
    .count-pill { padding: 7px 11px; border: 1px solid #53694d; border-radius: 7px; color: var(--lime); background: #1a2a25; font-size: 12px; font-weight: 800; white-space: nowrap; font-variant-numeric: tabular-nums; }
    .sound-toggle {
      width: 44px; height: 44px; display: grid; place-items: center; flex: 0 0 auto;
      border: 1px solid var(--line); border-radius: 12px; color: var(--ink); cursor: pointer;
      background: var(--panel-raised); transition: border-color .18s ease, background .18s ease, transform .18s ease;
    }
    .sound-toggle:hover { border-color: var(--lime); background: #24384a; transform: translateY(-1px); }
    .sound-toggle[aria-pressed="false"] { color: var(--muted); }
    .sound-toggle svg { width: 20px; height: 20px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
    .wheel-wrap { position: relative; width: min(100%, 610px); aspect-ratio: 1; display: grid; place-items: center; margin: 4px auto 0; }
    canvas { display: block; width: 100%; height: 100%; }
    .pointer { position: absolute; z-index: 2; top: -1px; left: 50%; width: 0; height: 0; transform: translateX(-50%); border-left: 14px solid transparent; border-right: 14px solid transparent; border-top: 31px solid var(--lime); filter: drop-shadow(0 4px 7px rgba(0, 0, 0, .55)); }
    .spin-button {
      position: absolute; z-index: 3; width: 25%; min-width: 98px; aspect-ratio: 1;
      display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 1px;
      border: 6px solid #182638; border-radius: 50%; color: #111a17; cursor: pointer;
      background: var(--lime); box-shadow: 0 9px 20px rgba(0, 0, 0, .35), inset 0 1px 0 rgba(255, 255, 255, .7);
      transition: transform .2s cubic-bezier(.2,.8,.2,1), background .2s ease;
    }
    .spin-button strong { font-size: clamp(17px, 2vw, 22px); font-weight: 900; }
    .spin-button span { font-size: 10px; font-weight: 900; letter-spacing: .17em; }
    .spin-button:hover:not(:disabled) { transform: scale(1.06); background: #e0ff8b; }
    .spin-button:active:not(:disabled) { transform: scale(.97); }
    .spin-button:disabled { cursor: wait; opacity: .72; }
    .wheel-caption { margin: 0; color: var(--muted); font-size: 12px; line-height: 1.6; text-align: center; }
    .side { min-width: 0; display: grid; grid-template-rows: auto minmax(0, 1fr); gap: 18px; }
    .result-card, .list-card { padding: 21px; }
    .side-heading { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
    .tag { padding: 6px 8px; border: 1px solid #485b68; border-radius: 5px; color: #d5e0dc; background: #1b2937; font-family: "Barlow Condensed", sans-serif; font-size: 11px; font-weight: 700; letter-spacing: .08em; white-space: nowrap; }
    .result-name { min-height: 75px; display: flex; align-items: center; margin: 10px 0 2px; color: var(--lime); font-family: "Barlow Condensed", "Arial Narrow", sans-serif; font-size: clamp(36px, 4vw, 54px); font-weight: 800; line-height: 1.06; overflow-wrap: anywhere; }
    .result-hint { margin: 0; color: var(--muted); font-size: 13px; line-height: 1.65; }
    .history { display: flex; flex-wrap: wrap; gap: 7px; min-height: 28px; margin-top: 15px; }
    .history-item { display: inline-flex; align-items: center; min-height: 30px; padding: 5px 9px; border: 1px solid #405262; border-radius: 6px; color: #dfe9e7; background: #192635; font-size: 12px; font-weight: 700; }
    .reset { min-height: 42px; padding: 0 12px; border: 1px solid var(--line); border-radius: 8px; color: var(--muted); cursor: pointer; background: transparent; font-size: 12px; font-weight: 700; transition: color .18s ease, border-color .18s ease, background .18s ease; }
    .reset:hover { color: var(--ember); border-color: #9b644d; background: #2a211f; }
    .list-subtitle { margin: 12px 0 11px; color: var(--muted); font-size: 12px; line-height: 1.6; }
    .search { width: 100%; min-height: 46px; padding: 0 13px; border: 1px solid #435363; border-radius: 9px; outline: none; color: var(--ink); background: #0d1723; font-size: 14px; }
    .search::placeholder { color: #9baeb5; opacity: 1; }
    .search:focus-visible { border-color: var(--lime); }
    .hero-list { max-height: 315px; min-height: 180px; overflow: auto; overscroll-behavior: contain; margin-top: 10px; border: 1px solid var(--line); border-radius: 9px; background: #0d1723; scrollbar-color: #71868a #172331; scrollbar-width: thin; }
    .hero-item { min-height: 38px; display: flex; align-items: center; padding: 7px 12px; border-bottom: 1px solid rgba(175, 204, 207, .1); color: #e5edeb; font-size: 13px; }
    .hero-item:last-child { border-bottom: 0; }
    .hero-item:nth-child(odd) { background: rgba(255, 255, 255, .025); }
    .empty { padding: 18px 12px; color: var(--muted); font-size: 13px; }
    .list-footer { display: flex; justify-content: space-between; gap: 10px; margin-top: 10px; color: var(--muted); font-size: 11px; }
    @media (min-width: 1180px) { .wheel-panel { min-height: 720px; } }
    @media (max-width: 900px) {
      .layout { grid-template-columns: minmax(0, 1fr) minmax(290px, .82fr); gap: 13px; }
      .wheel-panel { min-height: 590px; padding-inline: 17px; }
      .result-card, .list-card { padding: 17px; }
      .hero-list { max-height: 270px; }
    }
    @media (max-width: 720px) {
      .page { width: min(100% - 28px, 600px); padding: 20px 0 32px; }
      header { align-items: flex-start; margin-bottom: 17px; }
      .header-note { max-width: 150px; padding-top: 3px; font-size: 12px; }
      .brand-mark { width: 42px; height: 42px; flex-basis: 42px; }
      h1 { font-size: clamp(27px, 7vw, 38px); }
      .layout { grid-template-columns: 1fr; gap: 14px; }
      .wheel-panel { min-height: 0; padding: 16px 14px 18px; }
      .wheel-wrap { width: min(100%, 540px); }
      .side { grid-template-rows: auto auto; gap: 14px; }
      .result-card, .list-card { padding: 18px; }
      .result-name { min-height: 60px; font-size: clamp(38px, 10vw, 52px); }
      .hero-list { max-height: 280px; }
    }
    @media (max-width: 390px) {
      .page { width: calc(100% - 20px); }
      header { gap: 10px; }
      .brand { gap: 10px; }
      .header-note { max-width: 104px; font-size: 11px; }
      .wheel-heading h2 { font-size: 14px; }
      .count-pill { padding-inline: 7px; font-size: 11px; }
      .wheel-controls { gap: 6px; }
      .sound-toggle { width: 42px; height: 42px; }
      .wheel-caption { max-width: 32ch; }
      .list-footer { flex-wrap: wrap; }
    }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { scroll-behavior: auto !important; animation-duration: .01ms !important; animation-iteration-count: 1 !important; transition-duration: .01ms !important; }
    }
  </style>
</head>
<body>
  <main class="page">
    <header>
      <div class="brand">
        <div class="brand-mark" aria-hidden="true"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m12 2 2.3 6.7L21 11l-6.7 2.3L12 20l-2.3-6.7L3 11l6.7-2.3L12 2z" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"></path><circle cx="19" cy="18" r="2"></circle></svg></div>
        <div><h1>英雄大轉盤</h1></div>
      </div>
      <div class="header-note">選擇困難？<br>讓命運幫你決定。</div>
    </header>

    <div class="layout">
      <section class="panel wheel-panel" aria-label="英雄抽選轉盤">
        <div class="wheel-heading">
          <h2>準備好抽出你的英雄了嗎？</h2>
          <div class="wheel-controls"><button class="sound-toggle" id="soundToggle" type="button" aria-pressed="true" aria-label="關閉轉盤音效" title="音效開啟"></button><span class="count-pill" id="wheelCount">載入中</span></div>
        </div>
        <div class="wheel-wrap">
          <canvas id="wheel" aria-label="由全部英雄組成的彩色轉盤"></canvas>
          <div class="pointer" aria-hidden="true"></div>
          <button class="spin-button" id="spinButton" type="button" aria-label="開始轉動轉盤">
            <strong>開始</strong><span>SPIN</span>
          </button>
        </div>
        <p class="wheel-caption">點擊中央按鈕開始轉動 · 每位英雄都有相同機率</p>
      </section>

      <aside class="side">
        <section class="panel result-card" aria-live="polite">
          <div class="side-heading"><h2>命運揭曉</h2><span class="tag">YOUR PICK</span></div>
          <div class="result-name" id="resultName">等你來轉</div>
          <p class="result-hint" id="resultHint">轉盤停下後，抽選結果會顯示在這裡。</p>
          <div class="history" id="history" aria-label="最近抽選結果"></div>
        </section>

        <section class="panel list-card">
          <div class="side-heading"><h2>英雄名單</h2><button class="reset" id="resetButton" type="button">清除紀錄</button></div>
          <p class="list-subtitle">所有選項都在轉盤中 · 搜尋來確認名單</p>
          <input class="search" id="search" type="search" placeholder="搜尋英雄名稱…" autocomplete="off" aria-label="搜尋英雄名稱">
          <div class="hero-list" id="heroList" aria-live="polite"></div>
          <div class="list-footer"><span id="visibleCount"></span><span>名單依照提供順序</span></div>
        </section>
      </aside>
    </div>
  </main>
  <script>
    const heroes = [
      "刀锋宝贝", "王维", "卢雅那", "孙悟空", "心魔六耳", "元流之子(刺客)", "大禹", "元流之子(辅助)", "蚩奼", "孙权",
      "元流之子(射手)", "空空儿", "苍", "影", "少司缘", "元流之子(坦克)", "元流之子(法师)", "敖隐", "大司命", "云中君",
      "海诺", "朵莉亚", "亚连", "姬小满", "狂铁", "莱西奥", "赵怀真", "海月", "戈娅", "宫本武藏",
      "桑启", "暃", "金蝉", "姜子牙", "弈星", "梦奇", "艾琳", "云缨", "司空震", "澜",
      "夏洛特", "阿古朵", "蒙恬", "廉颇", "镜", "白起", "蒙犽", "鲁班大师", "西施", "马超",
      "曜", "瑶", "盘古", "猪八戒", "嫦娥", "鬼谷子", "李信", "上官婉儿", "元歌", "米莱狄",
      "马可波罗", "张良", "裴擒虎", "杨玉环", "公孙离", "明世隐", "后羿", "女娲", "苏烈", "周瑜",
      "百里玄策", "百里守约", "铠", "芈月", "亚瑟", "盾山", "沈梦溪", "伽罗", "司马懿", "孙策",
      "干将莫邪", "狄仁杰", "刘备", "阿轲", "刘邦", "东皇太一", "大乔", "黄忠", "诸葛亮", "哪吒",
      "太乙真人", "蔡文姬", "雅典娜", "杨戬", "钟馗", "虞姬", "李元芳", "张飞", "牛魔", "橘右京",
      "娜可露露", "不知火舞", "花木兰", "兰陵王", "王昭君", "韩信", "露娜", "程咬金", "安琪拉", "貂蝉",
      "关羽", "老夫子", "武则天", "项羽", "达摩", "李白", "典韦", "曹操", "甄姬", "夏侯惇",
      "吕布", "扁鹊", "孙膑", "钟无艳", "高渐离", "刘禅", "庄周", "鲁班七号", "孙尚香", "嬴政",
      "妲己", "墨子", "赵云", "小乔"
    ];

    const canvas = document.getElementById("wheel");
    const ctx = canvas.getContext("2d");
    const spinButton = document.getElementById("spinButton");
    const resultName = document.getElementById("resultName");
    const resultHint = document.getElementById("resultHint");
    const heroList = document.getElementById("heroList");
    const search = document.getElementById("search");
    const historyEl = document.getElementById("history");
    const palette = ["#c7f25e", "#f5a462", "#48b8a3", "#597ce0", "#f1d75d", "#aa83dc", "#e76f51", "#6ecad0"];
    const TAU = Math.PI * 2;
    let rotation = 0;
    let spinning = false;
    const SOUND_STEP = Math.PI;
    let soundEnabled = true;
    let soundContext = null;
    let lastSoundMark = 0;

    function getSoundContext() {
      if (!soundEnabled) return null;
      const AudioContextClass = window.AudioContext || window.webkitAudioContext;
      if (!AudioContextClass) return null;
      if (!soundContext) soundContext = new AudioContextClass();
      if (soundContext.state === "suspended") soundContext.resume().catch(() => {});
      return soundContext;
    }

    function playWheelTone(frequency, delay, duration, volume, type) {
      const audio = getSoundContext();
      if (!audio) return;
      const start = audio.currentTime + delay;
      const oscillator = audio.createOscillator();
      const gain = audio.createGain();
      oscillator.type = type || "sine";
      oscillator.frequency.setValueAtTime(frequency, start);
      gain.gain.setValueAtTime(0.0001, start);
      gain.gain.exponentialRampToValueAtTime(volume, start + 0.008);
      gain.gain.exponentialRampToValueAtTime(0.0001, start + duration);
      oscillator.connect(gain);
      gain.connect(audio.destination);
      oscillator.start(start);
      oscillator.stop(start + duration + 0.02);
    }

    function wheelSpinSound() {
      playWheelTone(460, 0, 0.075, 0.035, "sine");
    }

    function wheelTickSound() {
      playWheelTone(980, 0, 0.026, 0.035, "triangle");
    }

    function wheelWinSound() {
      if (!soundEnabled) return;
      playWheelTone(660, 0, 0.13, 0.045, "sine");
      playWheelTone(784, 0.12, 0.15, 0.045, "sine");
      playWheelTone(1047, 0.25, 0.25, 0.05, "sine");
    }

    function updateSoundButton() {
      const button = document.getElementById("soundToggle");
      button.innerHTML = soundEnabled
        ? '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 10v4h4l5 4V6l-5 4H4z"></path><path d="M16 9a5 5 0 0 1 0 6"></path><path d="M18.5 6.5a9 9 0 0 1 0 11"></path></svg>'
        : '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 10v4h4l5 4V6l-5 4H4z"></path><path d="m17 9 5 6"></path><path d="m22 9-5 6"></path></svg>';
      button.setAttribute("aria-pressed", String(soundEnabled));
      button.setAttribute("aria-label", soundEnabled ? "關閉轉盤音效" : "開啟轉盤音效");
      button.title = soundEnabled ? "音效開啟" : "音效關閉";
    }

    document.getElementById("soundToggle").addEventListener("click", () => {
      soundEnabled = !soundEnabled;
      updateSoundButton();
      if (soundEnabled) getSoundContext();
    });
    updateSoundButton();


    let history = [];
    let animationFrame;

    function drawWheel() {
      const size = canvas.clientWidth;
      if (!size) return;
      const dpr = window.devicePixelRatio || 1;
      const pixelSize = Math.round(size * dpr);
      if (canvas.width !== pixelSize || canvas.height !== pixelSize) {
        canvas.width = pixelSize;
        canvas.height = pixelSize;
      }
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      ctx.clearRect(0, 0, size, size);
      const center = size / 2;
      const radius = size * .465;
      const step = TAU / heroes.length;
      ctx.save();
      ctx.translate(center, center);
      ctx.rotate(rotation);
      for (let i = 0; i < heroes.length; i++) {
        const start = i * step;
        ctx.beginPath();
        ctx.moveTo(0, 0);
        ctx.arc(0, 0, radius, start, start + step);
        ctx.closePath();
        ctx.fillStyle = palette[i % palette.length];
        ctx.fill();
        ctx.strokeStyle = "rgba(20, 20, 34, .42)";
        ctx.lineWidth = Math.max(1, size * .0022);
        ctx.stroke();
      }
      ctx.restore();
      ctx.beginPath();
      ctx.arc(center, center, radius + size * .012, 0, TAU);
      ctx.strokeStyle = "rgba(255,255,255,.78)";
      ctx.lineWidth = size * .014;
      ctx.stroke();
      ctx.beginPath();
      ctx.arc(center, center, radius + size * .026, 0, TAU);
      ctx.strokeStyle = "rgba(255,255,255,.14)";
      ctx.lineWidth = size * .006;
      ctx.stroke();
      const dotRadius = size * .008;
      for (let i = 0; i < 36; i++) {
        const a = i * TAU / 36 - Math.PI / 2;
        const r = radius + size * .026;
        ctx.beginPath();
        ctx.arc(center + Math.cos(a) * r, center + Math.sin(a) * r, dotRadius, 0, TAU);
        ctx.fillStyle = i % 3 === 0 ? "#fff0aa" : "rgba(255,255,255,.55)";
        ctx.fill();
      }
    }

    function renderList() {
      const query = search.value.trim().toLocaleLowerCase();
      const matches = heroes.filter(name => name.toLocaleLowerCase().includes(query));
      heroList.replaceChildren();
      if (!matches.length) {
        const empty = document.createElement("div");
        empty.className = "empty";
        empty.textContent = "找不到符合的英雄";
        heroList.append(empty);
      } else {
        const fragment = document.createDocumentFragment();
        for (const name of matches) {
          const item = document.createElement("div");
          item.className = "hero-item";
          item.textContent = name;
          item.title = name;
          fragment.append(item);
        }
        heroList.append(fragment);
      }
      document.getElementById("visibleCount").textContent = query ? `顯示 ${matches.length} / ${heroes.length} 位` : `共 ${heroes.length} 位英雄`;
    }

    function renderHistory() {
      historyEl.replaceChildren();
      for (const name of history) {
        const chip = document.createElement("span");
        chip.className = "history-item";
        chip.textContent = name;
        historyEl.append(chip);
      }
    }

    function normalize(angle) { return ((angle % TAU) + TAU) % TAU; }

    function spin() {
      lastSoundMark = Math.floor(rotation / SOUND_STEP);
      wheelSpinSound();
      if (spinning) return;
      spinning = true;
      spinButton.disabled = true;
      resultHint.textContent = "轉盤正在選擇你的英雄…";
      const step = TAU / heroes.length;
      const targetIndex = Math.floor(Math.random() * heroes.length);
      const alignedRotation = -Math.PI / 2 - (targetIndex + .5) * step;
      const delta = 8 * TAU + normalize(alignedRotation - rotation);
      const startRotation = rotation;
      const endRotation = rotation + delta;
      const duration = window.matchMedia("(prefers-reduced-motion: reduce)").matches ? 250 : 5200;
      const startTime = performance.now();

      function frame(now) {
        const t = Math.min(1, (now - startTime) / duration);
        const eased = 1 - Math.pow(1 - t, 4);
        rotation = startRotation + delta * eased;
        if (duration > 1200) {
          const soundMark = Math.floor(rotation / SOUND_STEP);
          if (soundMark > lastSoundMark) { lastSoundMark = soundMark; wheelTickSound(); }
        }
        drawWheel();
        if (t < 1) {
          animationFrame = requestAnimationFrame(frame);
        } else {
          rotation = endRotation;
          drawWheel();
          showResult(heroes[targetIndex]);
          spinning = false;
          spinButton.disabled = false;
        }
      }
      animationFrame = requestAnimationFrame(frame);
    }

    function showResult(name) {
      resultName.textContent = name;
      wheelWinSound();
      resultHint.textContent = "這次就選它吧！再轉一次，看看下一位是誰。";
      history.unshift(name);
      history = history.slice(0, 5);
      renderHistory();
    }

    document.getElementById("wheelCount").textContent = `${heroes.length} 位英雄`;
    search.addEventListener("input", renderList);
    spinButton.addEventListener("click", spin);
    document.getElementById("resetButton").addEventListener("click", () => {
      history = [];
      renderHistory();
      resultName.textContent = "等你來轉";
      resultHint.textContent = "轉盤停下後，抽選結果會顯示在這裡。";
    });
    window.addEventListener("resize", drawWheel);
    renderList();
    drawWheel();
  </script>
</body>
</html>
